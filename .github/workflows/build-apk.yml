name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile SkidwareDNS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11 (javac -source 8; d8 8.2 crashes on JDK 21 $1.class)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up JDK 21 (apksigner / PKCS12)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK build-tools 34 + platform 34
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/build-tools" "$SDK/platforms" "$HOME/sdk-dl"
          curl -fsSL -o "$HOME/sdk-dl/build-tools.zip" \
            https://dl.google.com/android/repository/build-tools_r34-linux.zip
          curl -fsSL -o "$HOME/sdk-dl/platform.zip" \
            https://dl.google.com/android/repository/platform-34-ext7_r03.zip
          mkdir -p "$HOME/sdk-dl/bt" "$HOME/sdk-dl/plat"
          unzip -q "$HOME/sdk-dl/build-tools.zip" -d "$HOME/sdk-dl/bt"
          unzip -q "$HOME/sdk-dl/platform.zip" -d "$HOME/sdk-dl/plat"
          BT="$(find "$HOME/sdk-dl/bt" -mindepth 1 -maxdepth 1 -type d | head -1)"
          PL="$(find "$HOME/sdk-dl/plat" -mindepth 1 -maxdepth 1 -type d | head -1)"
          mv "$BT" "$SDK/build-tools/34.0.0"
          mv "$PL" "$SDK/platforms/android-34"
          test -x "$SDK/build-tools/34.0.0/aapt2"
          test -f "$SDK/platforms/android-34/android.jar"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Decode release keystore from Actions secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEYSTORE_BASE64}" ]; then
            echo "SIGNING_KEYSTORE_BASE64 is not set — unsigned APK only"
            echo "DO_SIGN=0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          echo "DO_SIGN=1" >> "$GITHUB_ENV"
          echo "SKID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          SKID_STOREPASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SKID_KEYPASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SKID_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SKID_OUT_APK: ${{ github.workspace }}/SkidwareDNS.apk
          SKID_UNSIGNED_APK: ${{ github.workspace }}/SkidwareDNS-unsigned.apk
        run: bash ./build_apk.sh

      - name: Wipe keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" skidwaredns-release.jks || true

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: SkidwareDNS-unsigned
          path: SkidwareDNS-unsigned.apk
          if-no-files-found: error

      - name: Upload signed APK
        if: env.DO_SIGN == '1'
        uses: actions/upload-artifact@v4
        with:
          name: SkidwareDNS-signed
          path: SkidwareDNS.apk
          if-no-files-found: error

      - name: Attach signed APK to version tag
        if: env.DO_SIGN == '1' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SkidwareDNS.apk
          generate_release_notes: true
